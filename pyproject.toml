[project]
name = "ghost-trials-autopsy"
version = "0.1.0"
description = "Deep research agent that investigates clinical trials that stopped early: registry reason vs. investor filings vs. publications"
requires-python = ">=3.11"
dependencies = [
    "duckdb==2.0.0",
    "fastapi==0.162.0",
    "google-cloud-aiplatform==2.7.0",
    "httpx==0.28.1",
    "openai-agents[litellm]==0.24.0",
    "python-dotenv==1.2.4",
    "rapidfuzz==3.14.6",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "google-genai==2.34.0",
    "inspect-ai==0.3.287",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
]
