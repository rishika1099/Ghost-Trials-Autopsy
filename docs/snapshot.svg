<title id="gt-data-title">Ghost Trials Autopsy snapshot</title>
<desc id="gt-data-desc">scripts/build_snapshot.py pulls trials from ClinicalTrials.gov into the trials table and derives due dates, lateness and a stop-reason category. Sponsors are matched to SEC company ids, 8-K filings near each stop are pulled, and filings whose reason differs from the registry become discrepancies. PubMed and Europe PMC articles are linked to each trial by NCT ID.</desc>
