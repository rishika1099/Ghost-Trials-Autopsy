<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 488" width="960" height="488" role="img" aria-labelledby="gt-arch-title gt-arch-desc">
<title id="gt-arch-title">Ghost Trials Autopsy architecture</title>
<desc id="gt-arch-desc">The browser sends a question to FastAPI on Cloud Run. The Lead decides whether to clarify, refuse or research. To research, it dispatches three Researchers at once, each in a fresh context: trials, disclosures and publications. Each reads the DuckDB snapshot and calls its live APIs. Findings and gaps go back to the Lead, which can run up to three rounds. The Writer drafts a cited report from the evidence store, and the Citation Checker fixes or removes unsupported sentences. The Skeptic then reads the checked report like an editor: how strong the finding is, ordinary explanations the records can't rule out, and questions for the sponsor. Separately, the Ledger Analyst answers whole-snapshot questions from the ghost ledger (/api/ask) with read-only SQL.</desc>
